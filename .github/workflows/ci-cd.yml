name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FinanceManagerApi.sln

      - name: Build
        run: dotnet build FinanceManagerApi.sln -c Release --no-restore

      - name: Test
        run: dotnet test FinanceManagerApi.sln -c Release --no-build --verbosity normal

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./FinanceManagerApi/Dockerfile
          push: true
          tags: musarratchowdhury/financemanagerapi:latest

      - name: Install EF Core tool globally
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Ensure EF tools are on PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate migration SQL script (idempotent — only includes pending migrations)
        id: generate-sql
        env:
          ConnectionStrings__CockroachDb: ${{ secrets.COCKROACH_CONNECTION_STRING }}
        run: |
          mkdir -p sql
          dotnet ef migrations script \
            --project FinanceManagerApi/FinanceManagerApi.csproj \
            --startup-project FinanceManagerApi/FinanceManagerApi.csproj \
            --idempotent \
            --output sql/pending.sql

          if [ -s sql/pending.sql ]; then
            echo "has_sql=true" >> $GITHUB_OUTPUT
            echo "Generated sql/pending.sql ($(wc -l < sql/pending.sql) lines)"
            head -50 sql/pending.sql
          else
            echo "has_sql=false" >> $GITHUB_OUTPUT
            echo "No pending migrations — sql/pending.sql is empty"
          fi

      - name: Apply migration SQL to CockroachDB
        if: steps.generate-sql.outputs.has_sql == 'true'
        env:
          COCKROACH_CONNECTION_STRING: ${{ secrets.COCKROACH_CONNECTION_STRING }}
        run: |
          curl -Ls https://binaries.cockroachdb.com/cockroach-v24.2.0.linux-amd64.tgz | tar xz cockroach-v24.2.0.linux-amd64/cockroach
          export PATH="$PWD/cockroach-v24.2.0.linux-amd64:$PATH"

          # Accept either an Npgsql connection string or a PostgreSQL URL.
          # Credentials are URL-encoded so passwords containing URL characters work.
          COCKROACH_URL="$(python3 - <<'PY'
          import os
          from urllib.parse import quote

          raw = os.environ["COCKROACH_CONNECTION_STRING"].strip()
          if raw.startswith(("postgres://", "postgresql://")):
              print(raw)
              raise SystemExit

          values = {}
          for part in raw.split(";"):
              if "=" in part:
                  key, value = part.split("=", 1)
                  values[key.strip().lower()] = value.strip()

          def get(*keys, default=""):
              for key in keys:
                  if key in values:
                      return values[key]
              return default

          host = get("host")
          port = get("port", default="26257")
          user = get("username", "user", "userid")
          password = get("password", "pwd")
          database = get("database", "initial catalog")
          if not host or not user or not database:
              raise SystemExit("COCKROACH_CONNECTION_STRING must include Host, Username, and Database")

          print(
              f"postgresql://{quote(user, safe='')}:{quote(password, safe='')}"
              f"@{host}:{port}/{quote(database, safe='')}?sslmode=require"
          )
          PY
          )"

          # CockroachDB rejects DDL inside EF's DO $EF$ blocks. Unwrap them and
          # retain idempotency with CockroachDB's IF [NOT] EXISTS and ON CONFLICT.
          #
          # Two traps this has to dodge:
          #  - `dotnet ef migrations script` writes a UTF-8 BOM. The cockroach CLI
          #    reads the file literally, so the BOM lands in front of the first
          #    statement and it dies with "syntax error". Read with utf-8-sig
          #    (strips it) and write back with plain utf-8 (adds none).
          #  - `cockroach sql --set` configures CLIENT-SIDE options (display_format,
          #    errexit, ...), not server session variables, so --set=statement_timeout
          #    fails with "unknown variable name". The timeout is set with SQL below.
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("sql/pending.sql").read_text(encoding="utf-8-sig")
          source = re.sub(r"(?is)START TRANSACTION;\s*|COMMIT;\s*", "", source)
          source = re.sub(
              r"(?is)DO \$EF\$\s*BEGIN\s*IF NOT EXISTS\(.*?\)\s*THEN\s*(.*?)\s*END IF;\s*END \$EF\$;",
              r"\1",
              source,
          )
          source = re.sub(r'(?i)CREATE TABLE\s+(?=")', "CREATE TABLE IF NOT EXISTS ", source)
          source = re.sub(r'(?i)CREATE INDEX\s+(?=")', "CREATE INDEX IF NOT EXISTS ", source)
          source = re.sub(
              r'(?i)ALTER TABLE\s+("(?:[^"]|"")+")\s+ADD\s+CONSTRAINT\s+(?=")',
              r"ALTER TABLE \1 ADD CONSTRAINT IF NOT EXISTS ",
              source,
          )
          source = re.sub(
              r'(?i)ALTER TABLE\s+("(?:[^"]|"")+")\s+DROP\s+CONSTRAINT\s+(?=")',
              r"ALTER TABLE \1 DROP CONSTRAINT IF EXISTS ",
              source,
          )
          source = re.sub(
              r'(?i)ALTER TABLE\s+("(?:[^"]|"")+")\s+ADD\s+(?=")',
              r"ALTER TABLE \1 ADD COLUMN IF NOT EXISTS ",
              source,
          )
          source = re.sub(
              r'(?is)INSERT INTO "__EFMigrationsHistory" '
              r'\("MigrationId", "ProductVersion"\)\s*VALUES\s*'
              r"\('([^']+)', '([^']+)'\);",
              r'''INSERT INTO "__EFMigrationsHistory" ("MigrationId", "ProductVersion")
          VALUES ('\1', '\2') ON CONFLICT ("MigrationId") DO NOTHING;''',
              source,
          )
          # Bound the run so a wedged DDL statement cannot hang the job forever.
          source = "SET statement_timeout = '30s';\n" + source
          Path("sql/cockroach.sql").write_text(source, encoding="utf-8")
          PY

          echo "Applying migrations to CockroachDB..."
          cockroach sql \
            --url="$COCKROACH_URL" \
            --file=sql/cockroach.sql \
            2>&1 | tee apply.log

          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== Migration apply failed, last 50 lines ==="
            tail -50 apply.log
            exit $EXIT_CODE
          fi
          echo "Migrations applied successfully."

      - name: Notify Render to deploy
        # If using Render Auto-Deploy from Docker Hub, this step is not needed.
        # Only add RENDER_DEPLOY_HOOK_URL if you want to trigger an immediate deploy
        # manually (e.g., Render webhook URL configured in your Render service).
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "Skipping: no webhook set. Render will detect the new image on its own schedule."
          fi
