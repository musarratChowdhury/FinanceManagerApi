name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FinanceManagerApi.sln

      - name: Build
        run: dotnet build FinanceManagerApi.sln -c Release --no-restore

      - name: Test
        run: dotnet test FinanceManagerApi.sln -c Release --no-build --verbosity normal

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./FinanceManagerApi/Dockerfile
          push: true
          tags: musarratchowdhury/financemanagerapi:latest

      - name: Install EF Core tool globally
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Ensure EF tools are on PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate migration SQL script (idempotent — only includes pending migrations)
        id: generate-sql
        env:
          ConnectionStrings__CockroachDb: ${{ secrets.COCKROACH_CONNECTION_STRING }}
        run: |
          mkdir -p sql
          dotnet ef migrations script \
            --project FinanceManagerApi/FinanceManagerApi.csproj \
            --startup-project FinanceManagerApi/FinanceManagerApi.csproj \
            --idempotent \
            --output sql/pending.sql
          
          if [ -s sql/pending.sql ]; then
            echo "has_sql=true" >> $GITHUB_OUTPUT
            echo "Generated sql/pending.sql ($(wc -l < sql/pending.sql) lines)"
            head -50 sql/pending.sql
          else
            echo "has_sql=false" >> $GITHUB_OUTPUT
            echo "No pending migrations — sql/pending.sql is empty"
          fi

      - name: Apply migration SQL to CockroachDB (using psql with autocommit + retry)
        if: steps.generate-sql.outputs.has_sql == 'true'
        env:
          COCKROACH_CONNECTION_STRING: ${{ secrets.COCKROACH_CONNECTION_STRING }}
        run: |
          # Install postgresql client (psql) - available on ubuntu-latest
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          
          # Convert CockroachDB connection string to psql format
          # COCKROACH_CONNECTION_STRING is like: Host=xxx;Port=26257;Username=yyy;Password=zzz;Database=financedb;SSL Mode=Require;Trust Server Certificate=true;
          
          # Extract components
          DB_HOST=$(echo "$COCKROACH_CONNECTION_STRING" | sed -n 's/.*Host=\([^;]*\).*/\1/p')
          DB_PORT=$(echo "$COCKROACH_CONNECTION_STRING" | sed -n 's/.*Port=\([^;]*\).*/\1/p')
          DB_USER=$(echo "$COCKROACH_CONNECTION_STRING" | sed -n 's/.*Username=\([^;]*\).*/\1/p')
          DB_PASS=$(echo "$COCKROACH_CONNECTION_STRING" | sed -n 's/.*Password=\([^;]*\).*/\1/p')
          DB_NAME=$(echo "$COCKROACH_CONNECTION_STRING" | sed -n 's/.*Database=\([^;]*\).*/\1/p')
          
          export PGPASSWORD="$DB_PASS"
          export PGSSLMODE=require
          
          echo "Applying migrations to CockroachDB via psql..."
          
          # Apply with autocommit=on (each statement auto-commits, no transaction block issues)
          # Use ON_ERROR_STOP=off to continue past idempotent "already exists" statements
          psql "host=$DB_HOST port=$DB_PORT user=$DB_USER dbname=$DB_NAME sslmode=require" \
            -v ON_ERROR_STOP=off \
            -v AUTOCOMMIT=on \
            -f sql/pending.sql \
            2>&1 | tee apply.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== Migration apply failed, last 50 lines ==="
            tail -50 apply.log
            exit $EXIT_CODE
          fi
          echo "Migrations applied successfully."

      - name: Notify Render to deploy
        # If using Render Auto-Deploy from Docker Hub, this step is not needed.
        # Only add RENDER_DEPLOY_HOOK_URL if you want to trigger an immediate deploy
        # manually (e.g., Render webhook URL configured in your Render service).
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "Skipping: no webhook set. Render will detect the new image on its own schedule."
          fi